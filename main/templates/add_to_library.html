<h2>Додати "{{ game.title }}"</h2>

<form method="post">
    {% csrf_token %}

    <label>Статус:</label>
    <select name="status" id="statusSelect">
        <option value="want">Хочу пройти</option>
        <option value="playing">Проходжу</option>
        <option value="completed">Пройшов</option>
        <option value="dropped">Кинув</option>
    </select>

    <br><br>

    <label>Оцінка: <span id="ratingValue">5</span></label>
    <br>
    <input type="range" name="rating" id="ratingInput" min="1" max="10" value="5" disabled>

    <br><br>

    <button type="submit">Зберегти</button>
</form>

<script>
    const statusSelect = document.getElementById('statusSelect');
    const ratingInput = document.getElementById('ratingInput');
    const ratingValue = document.getElementById('ratingValue');

    statusSelect.addEventListener('change', function() {
        if (this.value === 'completed' || this.value === 'playing' || this.value === 'dropped') {
            ratingInput.disabled = false;
        } else {
            ratingInput.disabled = true;
            ratingInput.value = 5;
            ratingValue.innerText = 5;
        }
    });

    ratingInput.addEventListener('input', function() {
        ratingValue.innerText = this.value;
    });
</script>
