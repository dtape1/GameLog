{% extends 'base.html' %}

{% block content %}

<h2>Додати "{{ game.title }}"</h2>

<div class="card">
<form method="post">
    {% csrf_token %}

    <label>Статус:</label>
    <select name="status" id="statusSelect"></select>

    <br><br>

    <label>Оцінка (1-10):</label>
    <input type="range" name="rating" min="1" max="10" id="ratingRange">
    <span id="ratingValue">5</span>

    <br><br>

    <button type="submit">Зберегти</button>
</form>
</div>

<script>
    const gameType = "{{ game.type }}";
    const statusSelect = document.getElementById('statusSelect');
    const ratingRange = document.getElementById('ratingRange');
    const ratingValue = document.getElementById('ratingValue');

    function setStatuses() {
        statusSelect.innerHTML = '';

        if (gameType === 'single') {
            statusSelect.innerHTML = `
                <option value="want">Хочу пройти</option>
                <option value="playing">Проходжу</option>
                <option value="completed">Пройшов</option>
                <option value="dropped">Кинув</option>
            `;
        } else {
            statusSelect.innerHTML = `
                <option value="playing">Грав</option>
                <option value="dropped">Не грав</option>
            `;
        }
    }

    ratingRange.addEventListener('input', function() {
        ratingValue.innerText = this.value;
    });

    setStatuses();
</script>

{% endblock %}
