{% extends 'base.html' %}

{% block content %}

<h2>Топ ігри</h2>

{% for game in top_games %}
<div class="card">
    <a href="/games/{{ game.id }}/">
        <h3>{{ game.title }}</h3>
    </a>

    <p>{{ game.avg_rating|floatformat:1 }}/10</p>
</div>
{% empty %}
<p>Ще немає оцінених ігор</p>
{% endfor %}

{% endblock %}
