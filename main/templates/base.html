{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>GameLog</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="navbar">
    <h2>GameLog</h2>

    <div>
        <a href="/">Головна</a>
        <a href="/games/">Ігри</a>

        {% if user.is_authenticated %}
            <a href="/profile/{{ user.username }}/">Профіль</a>
            <a href="/logout/">Вийти</a>
        {% else %}
            <a href="/login/">Логін</a>
            <a href="/register/">Реєстрація</a>
        {% endif %}
    </div>
</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
