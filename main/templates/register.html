{% extends 'base.html' %}

{% block title %}Реєстрація — GameLog{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-box">
        <h1 class="auth-title">🎮 Реєстрація</h1>

        {% if error %}
            <div class="alert alert-danger" style="margin-bottom:1rem;">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="field">
                <label>Нікнейм</label>
                <input type="text" name="username" placeholder="Придумай нікнейм" required autofocus>
            </div>

            <div class="field">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Придумай пароль" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem;">
                Зареєструватись
            </button>
        </form>

        <div class="auth-footer">
            Вже маєш акаунт?
            <a href="{% url 'login' %}">Увійти</a>
        </div>
    </div>
</div>
{% endblock %}
