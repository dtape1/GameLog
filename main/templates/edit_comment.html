{% extends 'base.html' %}

{% block title %}Редагувати коментар — GameLog{% endblock %}

{% block content %}
<div class="container">
    <div class="lib-form-wrap">

        <a href="{% url 'game_detail' comment.game.id %}" class="btn btn-ghost btn-sm" style="margin-bottom:1.5rem;">
            ← До гри
        </a>

        <div class="card">
            <h2 style="font-family:'Syne',sans-serif; font-size:1.2rem; font-weight:800; margin-bottom:1.25rem;">
                ✏️ Редагувати коментар
            </h2>

            <form method="post">
                {% csrf_token %}

                <div class="field">
                    <label>Текст коментаря</label>
                    <textarea name="text" rows="5" style="
                        width:100%;
                        background:var(--bg2);
                        border:1px solid var(--border);
                        border-radius:var(--r-sm);
                        color:var(--text);
                        padding:.65rem .9rem;
                        font-size:.9rem;
                        font-family:'Manrope',sans-serif;
                        resize:vertical;
                        transition:border-color .2s;
                    " onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">{{ comment.text }}</textarea>
                </div>

                <div style="display:flex; gap:.75rem;">
                    <button type="submit" class="btn btn-primary">Зберегти</button>
                    <a href="{% url 'game_detail' comment.game.id %}" class="btn btn-ghost">Скасувати</a>
                </div>
            </form>
        </div>

    </div>
</div>
{% endblock %}
